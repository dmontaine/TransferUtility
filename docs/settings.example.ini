; TransferUtility example settings
;
; Copy this file to:
;   ~/.config/sd-transfer-utility/settings.ini
; and change the placeholders. The application never stores a password.
;
; Remote workstation profile (documented SD Core server):
[connection]
host=data.sdcoredb.org
port=22
user=YOUR_SD_USER
key=
; 0 SD Core for Linux (22), 1 SD Core for Windows (22),
; 2 SD Core Solo for Linux (4251), 3 SD Core Solo for Windows (4251)
server_type=0

; If the client runs on the SD Core server itself, use:
; host=127.0.0.1
; user=YOUR_SD_USER
;
; Host keys are confirmed in a dialog on first contact and saved in
; ~/.ssh/known_hosts.
;
; Upload = 0, Download = 1.
[ui]
mode=0
local_dir=/home/YOUR_USER
overwrite=0
; 1 = the SD Core pane shows bp instead of xfer.in / xfer.out
upload_to_bp=0
download_from_bp=0
